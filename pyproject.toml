[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protein-design"
version = "0.1.0"
description = "AI Protein Design System — Changjiang Cup 2026"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Protein Design Team"},
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "structlog>=23.0",
    "typer[all]>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
protein-design = "protein_design.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/protein_design"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
