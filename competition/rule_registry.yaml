# Competition Rule Registry
# AI Protein Design System — Changjiang Cup 2026
#
# Source: Official Competition Announcement & Track Specifications (Screenshot 2026-11-05 at 15.56.17)

competition:
  name: "Changjiang Cup 2026"
  organizer: "Changjiang Cup Organizing Committee"
  deadline: "2026-11-30T23:59:59"
  tracks_count: 7
  max_submissions_per_track: 20

rules:
  # Biological requirements
  de_novo_required: true
  allowed_amino_acids: "ACDEFGHIKLMNPQRSTVWY" # 20 natural standard amino acids only
  prohibited_elements:
    - signal_peptides
    - purification_tags # e.g. His-tag, Flag-tag
    - fc_fusions
    - non_standard_amino_acids
  mature_protein_only: true

  # Molecule type constraints
  molecule_types:
    minibinder:
      description: "Single polypeptide chain, single binding module"
      min_length: 40
      max_length: 100
      tracks: [5, 7]
    vhh:
      description: "Single domain antibody with full framework and CDRs"
      min_length: 100
      max_length: 150
      tracks: [1, 2, 3, 4, 6]

  # Deduplication & Priority Rules
  deduplication:
    coverage_threshold: 0.90
    identity_threshold: 1.00 # 100% identity
    vhh_region_scope: "CDR"  # For VHH, only CDR regions are compared
    priority_rule: "first_valid_submission_wins"

  # Evaluation & Scoring
  screening:
    in_silico:
      method: "ESMFold2 + ipSAE"
      top_k_selection: 1000 # Top 1,000 sequences per track advance to wet-lab
      params:
        seeds: 1
        samples: 1
        use_template: false
        target_msa: true
        design_msa: false
    wet_lab:
      primary_metric: "Kd" # Dissociation constant (smaller = stronger = higher rank)
      award_rule: "top_1_best_design_per_team"
      extra_assays:
        eligible_top_k: 50
        assays: ["druggability", "cell_activity"]
        bonus_prize: "5000 RMB per criterion if in Top 6"

  # Submission Package Format
  submission_package:
    file_formats: ["csv", "xlsx", "xls"]
    max_file_size_mb: 10
    file_naming_convention: "{Target}_submission.csv" # e.g. EGFR_submission.csv, TL1A_submission.csv
    header: ["name", "sequence"]
    max_rows: 21 # 1 header + max 20 candidate rows
    case_sensitive_check: true
    no_whitespace: true

